    <script>
      (function () {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (nativeFetch) {
            var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!winDesc || winDesc.configurable !== false) {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return nativeFetch;
                },
                set: function () {
                  // Safely absorb browser-extension assignments to window.fetch without throwing TypeError
                },
              });
            }
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (!protoDesc || protoDesc.configurable !== false) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function () {
                    return nativeFetch;
                  },
                  set: function () {},
                });
              }
            }
          }
        } catch (_err) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = event && event.message ? String(event.message) : '';
            var file = event && event.filename ? String(event.filename) : '';
            if (
              file.indexOf('chrome-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason =
              event && event.reason
                ? String(event.reason.stack || event.reason.message || event.reason)
                : '';
            if (
              reason.indexOf('chrome-extension://') !== -1 ||
              reason.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
